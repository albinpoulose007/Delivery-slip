<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Express Care Pharmacy Delivery Slip</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root {
      --red: #b5121b;
      --blue: #1d4fa3;
      --light-blue: #eef4fb;
      --border: #d6dbe3;
      --text: #18212f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light-blue);
      color: var(--text);
    }

    .header {
      background: linear-gradient(90deg, var(--red), var(--blue));
      padding: 18px;
      text-align: center;
      color: white;
    }

    .header img {
      max-width: 420px;
      width: 90%;
      background: white;
      border-radius: 10px;
      padding: 8px;
    }

    .header h2 {
      margin: 10px 0 0;
    }

    .container {
      max-width: 1100px;
      margin: 22px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 18px rgba(0,0,0,.08);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .tab {
      padding: 10px 18px;
      border: 0;
      border-radius: 7px;
      background: var(--blue);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .tab.active {
      background: var(--red);
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .title-row h3 {
      margin: 0;
      color: var(--red);
    }

    .date-field {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--blue);
      font-weight: 700;
    }

    .date-field label {
      white-space: nowrap;
    }

    .date-field input {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font: inherit;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 7px;
      padding: 9px 14px;
      font-weight: 700;
    }

    .primary { background: var(--blue); color: white; }
    .download { background: var(--red); color: white; }
    .secondary { background: #e6e9ee; color: #111; }
    .remove { background: #fee2e2; color: #991b1b; }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 9px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th {
      background: var(--red);
      color: white;
    }

    th, td {
      border-bottom: 1px solid var(--border);
      padding: 9px;
      text-align: left;
    }

    td input {
      width: 100%;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
    }

    .notes {
      margin-top: 20px;
    }

    .notes label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      color: var(--blue);
    }

    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
    }


    .driver-section {
      margin-top: 20px;
      padding: 16px;
      border: 2px solid var(--blue);
      border-radius: 9px;
      background: #f8fbff;
    }

    .driver-section h4 {
      margin: 0 0 14px;
      color: var(--blue);
      font-size: 17px;
    }

    .driver-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .driver-field label {
      display: block;
      margin-bottom: 7px;
      color: var(--blue);
      font-weight: 700;
    }

    .driver-field input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font: inherit;
    }

    .signature-display-line {
      height: 42px;
      border-bottom: 2px solid #222;
    }

    .signature-input {
      border: 0 !important;
      border-bottom: 2px solid #222 !important;
      border-radius: 0 !important;
      background: transparent;
    }

    @media (max-width: 700px) {
      .driver-grid {
        grid-template-columns: 1fr;
      }
    }

    .footer {
      margin-top: 15px;
      color: #667085;
      font-size: 13px;
      text-align: center;
    }

    @media print {
      .tabs, .actions, .footer, .remove-column { display: none !important; }
      body { background: white; }
      .container { box-shadow: none; margin: 0; max-width: none; }
      input, textarea { border: none; }
      .driver-section { background: white; page-break-inside: avoid; }
      .signature-input { border-bottom: 2px solid #222 !important; }
    }
  </style>
</head>

    <h2>Delivery Slip Generator</h2>
  </header>

  <main class="container">
    <div class="tabs">
      <button class="tab active" onclick="setType('Wednesday Delivery', this)">Wednesday</button>
      <button class="tab" onclick="setType('Thursday Delivery', this)">Thursday</button>
      <button class="tab" onclick="setType('STAT Delivery', this)">STAT</button>
    </div>

    <div class="title-row">
      <h3 id="title">Wednesday Delivery</h3>
      <div class="date-field">
        <label for="deliveryDate">Delivery Date</label>
        <input type="date" id="deliveryDate">
      </div>
    </div>

    <div class="actions">
      <button class="primary" onclick="addRow()">+ Add Patient</button>
      <button class="download" onclick="downloadPDF()">Download PDF</button>
      <button class="secondary" onclick="printSlip()">Print</button>
      <button class="secondary" onclick="clearAll()">Clear List</button>
    </div>

    <div class="table-wrap">
      <table id="patientTable">
        <thead>
          <tr>
            <th style="width:55px;">#</th>
            <th>Patient Name</th>
            <th class="remove-column" style="width:100px;">Remove</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <datalist id="patientNameSuggestions"></datalist>
    </div>

    <div class="notes">
      <label for="specialNotes">Special Notes</label>
      <textarea id="specialNotes" placeholder="Enter any special delivery notes..."></textarea>
    </div>

    <div class="driver-section">
      <h4>Driver Confirmation</h4>
      <div class="driver-grid">
        <div class="driver-field">
          <label for="driverName">Driver Name</label>
          <input type="text" id="driverName" placeholder="Enter driver name" />
        </div>
        <div class="driver-field">
          <label for="driverSignature">Driver Signature</label>
          <input type="text" id="driverSignature" class="signature-input" aria-label="Driver signature" />
        </div>
      </div>
    </div>


    <div class="footer">
      Patient information is processed only in this browser.
    </div>
  </main>

    function updatePatientSuggestions(input) {
      const query = input.value.trim().toLowerCase();
      const datalist = document.getElementById("patientNameSuggestions");
      datalist.innerHTML = "";

      if (query.length < 2) return;

      patientNames
        .filter(name => name.toLowerCase().split(/[\s,]+/).some(part => part.startsWith(query)))
        .forEach(name => {
          const option = document.createElement("option");
          option.value = name;
          datalist.appendChild(option);
        });
    }

    function getToday() {
      const today = new Date();
      return {
        display: today.toLocaleDateString("en-US"),
        file: today.toISOString().split("T")[0]
      };
    }

    function setDefaultDate() {
      document.getElementById("deliveryDate").value = getToday().file;
    }

    function getSelectedDate() {
      const value = document.getElementById("deliveryDate").value;

      if (!value) {
        alert("Please select the delivery date before printing or downloading the PDF.");
        return null;
      }

      const [year, month, day] = value.split("-");
      return {
        file: value,
        display: `${month}/${day}/${year}`
      };
    }

    function setType(type, button) {
      deliveryType = type;
      document.getElementById("title").textContent = type;
      document.querySelectorAll(".tab").forEach(btn => btn.classList.remove("active"));
      button.classList.add("active");
    }

    function addRow() {
      const tbody = document.querySelector("#patientTable tbody");
      const row = tbody.insertRow();

      row.innerHTML = `
        <td>${tbody.rows.length}</td>
        <td><input type="text" list="patientNameSuggestions" placeholder="Enter patient name" oninput="updatePatientSuggestions(this)"></td>
        <td class="remove-column">
          <button class="remove" onclick="removeRow(this)">Remove</button>
        </td>
      `;
    }

    function removeRow(button) {
      button.closest("tr").remove();
      renumberRows();
    }

    function renumberRows() {
      document.querySelectorAll("#patientTable tbody tr").forEach((row, index) => {
        row.cells[0].textContent = index + 1;
      });
    }

    function clearAll() {
      if (!confirm("Clear all patients and special notes?")) return;
      document.querySelector("#patientTable tbody").innerHTML = "";
      document.getElementById("specialNotes").value = "";
      addRow();
    }

    function validateRows() {
      const rows = [...document.querySelectorAll("#patientTable tbody tr")];

      if (!rows.length) {
        alert("Please add at least one patient.");
        return false;
      }

      for (let i = 0; i < rows.length; i++) {
        const name = rows[i].cells[1].querySelector("input").value.trim();

        if (!name) {
          alert(`Please enter the patient name in row ${i + 1}.`);
          return false;
        }
      }

      return true;
    }

      const driverName = document.getElementById("driverName")?.value.trim() || "";
      const driverSignature = document.getElementById("driverSignature")?.value.trim() || "";
      const footerPageHeight = doc.internal.pageSize.getHeight();
      const footerPageWidth = doc.internal.pageSize.getWidth();
      const bottomY = footerPageHeight - 20;

      // Add a new page if the patient table/notes extend into the footer area.
      const contentEndY = (doc.lastAutoTable && doc.lastAutoTable.finalY)
        ? doc.lastAutoTable.finalY
        : 0;

      if (contentEndY > bottomY - 28) {
        doc.addPage();

      const finalPageHeight = doc.internal.pageSize.getHeight();
      const finalBottomY = finalPageHeight - 18;
doc.setFontSize(10);
      doc.setTextColor(24, 33, 47);
